<section id="contact-form" class="py-5 bg-light">
  <div class="container">
    <div class="row text-center mb-5">
      <div class="col">
        <h2 class="fw-bold">Book Your First Class</h2>
        <p class="text-muted mb-0">Your first class is on us. Drop us a message and we'll get you set up.</p>
      </div>
    </div>
    <div class="row g-5">
      <div class="col-lg-7">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" class="form-control" placeholder="Your name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone (optional)</label>
              <input type="tel" class="form-control" placeholder="(555) 000-0000">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Experience Level</label>
              <select class="form-select">
                <option selected disabled>Select your level...</option>
                <option>Complete beginner</option>
                <option>Some experience (under 1 year)</option>
                <option>Intermediate (1–3 years)</option>
                <option>Advanced (3+ years)</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">What class are you interested in?</label>
              <select class="form-select">
                <option selected disabled>Select a class type...</option>
                <option>All Levels Vinyasa</option>
                <option>Hot Yoga</option>
                <option>Yin & Restorative</option>
                <option>Beginner's Workshop</option>
                <option>Prenatal Yoga</option>
                <option>Not sure — surprise me!</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Message (optional)</label>
              <textarea class="form-control" rows="3" placeholder="Any injuries, questions, or preferences we should know about?"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg">Claim My Free Class</button>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100 p-4">
          <h5 class="fw-bold mb-4">Find Us</h5>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-location-dot text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Studio Location</div>
              <div class="text-muted">88 Willow Street, Springfield, IL 62702</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-phone text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Phone</div>
              <div class="text-muted">(217) 555-0247</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-envelope text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Email</div>
              <div class="text-muted">hello@serenityflow.com</div>
            </div>
          </div>
          <div class="d-flex align-items-start">
            <i class="fa-solid fa-clock text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Studio Hours</div>
              <div class="text-muted">Mon–Fri: 6am – 8:30pm<br>Sat–Sun: 7am – 6pm</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
