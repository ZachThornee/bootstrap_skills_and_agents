<section id="contact-form" class="py-5 bg-white">
  <div class="container">
    <div class="row text-center mb-5">
      <div class="col">
        <h2 class="fw-bold">Start a Project</h2>
        <p class="text-muted mb-0">Tell me about your brand and what you need. I'll get back to you within 24 hours.</p>
      </div>
    </div>
    <div class="row g-5">
      <div class="col-lg-7">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Your Name</label>
              <input type="text" class="form-control" placeholder="Full name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Company / Brand</label>
              <input type="text" class="form-control" placeholder="Your company name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Project Type</label>
              <select class="form-select">
                <option selected disabled>Select a service...</option>
                <option>Brand Identity</option>
                <option>Print Design</option>
                <option>Digital & UI Design</option>
                <option>Studio Retainer</option>
                <option>Something else</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Tell me about your project</label>
              <textarea class="form-control" rows="5" placeholder="What are you working on? What's the timeline? Any reference brands you admire?"></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg">Send Enquiry</button>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100 p-4">
          <h5 class="fw-bold mb-4">Get in Touch</h5>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-envelope text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Email</div>
              <div class="text-muted">hello@formastudio.co</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-clock text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Response Time</div>
              <div class="text-muted">Within 24 hours, Monday–Friday</div>
            </div>
          </div>
          <div class="d-flex align-items-start">
            <i class="fa-solid fa-globe text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Working With</div>
              <div class="text-muted">Clients globally — US, UK, EU & APAC</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
