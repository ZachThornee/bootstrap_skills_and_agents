<section class="py-5 bg-light">
  <div class="container">
    <div class="row text-center mb-5">
      <div class="col">
        <h2 class="fw-bold">Get in Touch</h2>
        <p class="text-muted mb-0">Have a question or want to learn more? We'd love to hear from you.</p>
      </div>
    </div>
    <div class="row g-5">
      <div class="col-lg-7">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control" placeholder="Your name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Subject</label>
              <input type="text" class="form-control" placeholder="How can we help?">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Message</label>
              <textarea class="form-control" rows="5" placeholder="Tell us more..."></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100 p-4">
          <h5 class="fw-bold mb-4">Contact Details</h5>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-envelope text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Email</div>
              <div class="text-muted">hello@launchpad.io</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-phone text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Phone</div>
              <div class="text-muted">+1 (555) 000-1234</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-location-dot text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Office</div>
              <div class="text-muted">123 Startup Ave, San Francisco, CA 94107</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
