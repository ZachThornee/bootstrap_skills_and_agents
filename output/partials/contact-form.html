<section id="contact-form" class="py-5 bg-white">
  <div class="container">
    <div class="row text-center mb-5">
      <div class="col">
        <h2 class="fw-bold">Book Your Free 30-Minute Session</h2>
        <p class="text-muted mb-0">No commitment. Let's find out where your student is and how we can help.</p>
      </div>
    </div>
    <div class="row g-5">
      <div class="col-lg-7">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Parent / Guardian Name</label>
              <input type="text" class="form-control" placeholder="Your name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone</label>
              <input type="tel" class="form-control" placeholder="+1 (555) 000-0000">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Student's Grade</label>
              <select class="form-select">
                <option selected disabled>Select grade...</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">What does your student need help with?</label>
              <textarea class="form-control" rows="5" placeholder="e.g. Struggling with algebra, preparing for SAT, falling behind in class..."></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary btn-lg">Book Free Session</button>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm h-100 p-4">
          <h5 class="fw-bold mb-4">Contact Us</h5>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-envelope text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Email</div>
              <div class="text-muted">hello@claritymath.com</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-phone text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Phone</div>
              <div class="text-muted">+1 (555) 123-4567</div>
            </div>
          </div>
          <div class="d-flex align-items-start mb-4">
            <i class="fa-solid fa-location-dot text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Location</div>
              <div class="text-muted">In-person & online sessions available nationwide</div>
            </div>
          </div>
          <div class="d-flex align-items-start">
            <i class="fa-solid fa-clock text-primary me-3 mt-1"></i>
            <div>
              <div class="fw-semibold">Availability</div>
              <div class="text-muted">Mon–Sat: 7:00am – 9:00pm</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
